[project]
name = "beancount-mcp-server"
version = "0.1.0"
description = "MCP server for querying and updating Beancount ledgers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beancount>=3.0.0",
    "beanquery>=0.1.0",
    "mcp[cli]>=1.9.0",
]

[project.scripts]
beancount-mcp-server = "beancount_mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
